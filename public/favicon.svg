<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#12121f"/>

  <!-- Dice body -->
  <rect x="4" y="4" width="24" height="24" rx="5" fill="#c084fc"/>

  <!-- Pip top-left -->
  <circle cx="10" cy="10" r="2.5" fill="#12121f"/>

  <!-- Pip top-right -->
  <circle cx="22" cy="10" r="2.5" fill="#12121f"/>

  <!-- Pip middle-left -->
  <circle cx="10" cy="16" r="2.5" fill="#12121f"/>

  <!-- Pip middle-right -->
  <circle cx="22" cy="16" r="2.5" fill="#12121f"/>

  <!-- Pip bottom-left -->
  <circle cx="10" cy="22" r="2.5" fill="#12121f"/>

  <!-- Pip bottom-right -->
  <circle cx="22" cy="22" r="2.5" fill="#12121f"/>
</svg>
